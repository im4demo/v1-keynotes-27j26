services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: keynotes
    ports:
      - "5432:5432"
    volumes:
      - keynotes_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d keynotes"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/keynotes
      PORT: "4000"
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    environment:
      API_URL: http://api:4000
      NEXT_PUBLIC_API_URL: http://localhost:4000
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    ports:
      - "3000:3000"
    depends_on:
      - api

  website:
    build:
      context: .
      dockerfile: docker/website.Dockerfile
      args:
        NEXT_PUBLIC_WEB_URL: http://localhost:3000
    environment:
      NEXT_PUBLIC_WEB_URL: http://localhost:3000
      PORT: "3001"
      HOSTNAME: 0.0.0.0
    ports:
      - "3001:3001"
    depends_on:
      - web

volumes:
  keynotes_pgdata:
